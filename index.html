<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fasteners 3D Library</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        /* --- FUTURISTIC THEME VARIABLES --- */
        :root {
            --c-bg: #0b1121; /* Deepest Void */
            --c-surface: #151e32; /* Panel BG */
            --c-surface-hover: #1e293b;
            --c-border: #2d3b55;
            --c-primary: #06b6d4; /* Cyan Neon */
            --c-primary-dim: rgba(6, 182, 212, 0.1);
            --c-primary-glow: rgba(6, 182, 212, 0.5);
            --c-text-main: #f1f5f9;
            --c-text-muted: #94a3b8;
            --c-text-dim: #64748b;
            
            --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Monaco", monospace;
            
            --radius: 6px; 
            --blur: 16px;
            
            /* Neon Effects */
            --shadow-glow: 0 0 15px var(--c-primary-dim), 0 0 2px var(--c-primary);
            --text-glow: 0 0 8px rgba(6, 182, 212, 0.4);
            --border-glow: 0 0 8px rgba(6, 182, 212, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--c-bg);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.05), transparent 30%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.05), transparent 30%);
            color: var(--c-text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- ICONS (SVG Styling) --- */
        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
            transition: filter 0.2s ease;
        }
        .icon-lg { width: 20px; height: 20px; }

        /* --- LAYOUT --- */
        .app-layout {
            display: grid;
            grid-template-rows: 60px 1fr;
            height: 100%;
            width: 100%;
        }

        /* --- HEADER --- */
        .header {
            background: rgba(11, 17, 33, 0.85);
            backdrop-filter: blur(var(--blur));
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 50;
            box-shadow: 0 4px 30px rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--c-primary);
            text-shadow: var(--text-glow);
        }
        
        .brand-logo-gfx {
            width: 32px;
            height: 32px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid var(--c-primary);
            color: var(--c-primary);
            display: grid;
            place-items: center;
            border-radius: 4px;
            box-shadow: var(--shadow-glow);
        }

        .header-controls {
            display: flex;
            gap: 16px;
        }

        /* --- MAIN CONTAINER --- */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: rgba(11, 17, 33, 0.7);
            border-right: 1px solid var(--c-border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(var(--blur));
            height: 100%;
            overflow: hidden;
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--c-border);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--c-primary);
            width: 14px;
            height: 14px;
            opacity: 0.7;
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--c-border);
            color: var(--c-text-main);
            padding: 10px 12px 10px 36px;
            border-radius: var(--radius);
            font-size: 13px;
            font-family: var(--font-main);
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--c-primary);
            box-shadow: 0 0 0 1px var(--c-primary), inset 0 0 10px rgba(6, 182, 212, 0.1);
        }

        .catalog-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* Tree Items */
        .tree-item {
            display: block;
            cursor: pointer;
            margin-bottom: 4px;
            user-select: none;
        }

        .tree-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius);
            color: var(--c-text-muted);
            font-size: 13px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .tree-header:hover {
            background: var(--c-surface-hover);
            color: var(--c-text-main);
            border-color: rgba(255,255,255,0.05);
            /* Subtle glow on hover */
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }
        
        .tree-header:hover .icon {
            filter: drop-shadow(0 0 3px var(--c-primary));
            color: var(--c-primary);
        }
        
        /* Hierarchy indentation */
        .indent-1 { padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.05); margin-left: 10px; }
        .indent-2 { padding-left: 16px; border-left: 1px solid rgba(255,255,255,0.05); margin-left: 10px; }

        .tree-arrow {
            margin-right: 10px;
            transition: transform 0.2s;
            color: var(--c-text-dim);
            width: 12px;
            height: 12px;
            opacity: 0.7;
        }
        
        .tree-icon {
            margin-right: 10px;
            color: var(--c-text-muted);
            transition: 0.2s;
        }

        .tree-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        
        .expanded > .tree-header .tree-arrow {
            transform: rotate(90deg);
            color: var(--c-primary);
        }
        
        .expanded > .tree-header {
            color: var(--c-text-main);
            background: rgba(6, 182, 212, 0.05);
            border-color: rgba(6, 182, 212, 0.2);
        }

        .expanded > .tree-header .tree-icon {
            color: var(--c-primary);
            filter: drop-shadow(0 0 5px var(--c-primary-glow));
        }

        .tree-children {
            display: none;
        }
        
        .expanded > .tree-children {
            display: block;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* File Item */
        .file-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--c-text-muted);
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }

        .file-item:hover {
            color: var(--c-text-main);
            background: rgba(255,255,255,0.03);
            border-color: rgba(255,255,255,0.05);
        }
        
        .file-item:hover .icon {
            color: var(--c-primary);
            filter: drop-shadow(0 0 2px var(--c-primary));
        }

        .file-item.active {
            color: #fff;
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.15), transparent);
            border: 1px solid rgba(6, 182, 212, 0.3);
            box-shadow: inset 2px 0 0 var(--c-primary), 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .file-item.active .icon {
            color: var(--c-primary);
            filter: drop-shadow(0 0 4px var(--c-primary));
        }

        /* --- VIEWER --- */
        .viewer-area {
            position: relative;
            background: radial-gradient(circle at center, #111a2e 0%, #050914 100%);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Essential for Three.js to render correctly */
        #viewer-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            outline: none;
        }

        .viewer-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
            z-index: 10;
        }

        .model-title {
            font-size: 28px;
            font-weight: 200;
            color: var(--c-text-main);
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .model-subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--c-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: rgba(11, 17, 33, 0.8);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid rgba(6, 182, 212, 0.3);
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.1);
        }

        .viewer-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            background: rgba(15, 23, 42, 0.85);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            z-index: 10;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid transparent;
            color: var(--c-text-muted);
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: rgba(6, 182, 212, 0.1);
            color: var(--c-text-main);
            border-color: rgba(6, 182, 212, 0.3);
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }
        
        .btn-icon:hover svg {
            filter: drop-shadow(0 0 2px var(--c-primary));
        }

        /* --- LOADING & EMPTY STATES --- */
        .state-msg {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--c-text-dim);
            pointer-events: none;
            z-index: 5;
        }

        .state-msg svg {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            opacity: 0.4;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        
        .hidden { display: none !important; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Responsive */
        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
            .sidebar { position: absolute; inset: 0; z-index: 100; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block; }
        }
        @media (min-width: 769px) {
            .mobile-toggle { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="brand-logo-gfx">
                    <!-- Cube Icon -->
                    <svg class="icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                </div>
                <span>Fasteners<span style="color:var(--c-text-muted); font-weight:400; font-size: 0.9em;">DB</span></span>
            </div>
            
            <div class="header-controls">
                <button class="btn-icon mobile-toggle" onclick="toggleSidebar()">
                    <svg class="icon-lg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="https://github.com/nimageran/fasteners-viewer" target="_blank" class="btn-icon" title="View on GitHub">
                    <svg class="icon-lg" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                </a>
            </div>
        </header>

        <!-- MAIN WORKSPACE -->
        <main class="workspace">
            
            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="search-container">
                    <div class="search-box">
                        <!-- Search Icon -->
                        <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Search components...">
                    </div>
                </div>
                <div id="catalog-tree" class="catalog-tree">
                    <!-- Tree content injected by JS -->
                    <div class="state-msg" style="position:static; padding:20px;">
                        <svg class="icon-lg animate-spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                        <span style="font-size:12px; margin-top:10px;">Initializing Database...</span>
                    </div>
                </div>
            </aside>

            <!-- VIEWER AREA -->
            <section class="viewer-area">
                <div class="viewer-overlay">
                    <h1 id="model-title" class="model-title">Welcome</h1>
                    <div id="model-subtitle" class="model-subtitle">Select a component</div>
                </div>

                <!-- 3D Canvas Container -->
                <div id="viewer-container"></div>

                <div class="state-msg" id="empty-state">
                    <svg viewBox="0 0 24 24" class="icon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline><polyline points="7.5 19.79 7.5 14.6 3 12"></polyline><polyline points="21 12 16.5 14.6 16.5 19.79"></polyline><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <p>Select a file from the catalog</p>
                </div>

                <div class="state-msg hidden" id="loading-state">
                    <svg class="icon-lg" viewBox="0 0 24 24" style="animation: spin 1s linear infinite"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path></svg>
                    <p>Loading Geometry...</p>
                </div>

                <!-- Floating Controls -->
                <div class="viewer-controls">
                    <button class="btn-icon" onclick="setMaterial('zinc')" title="Zinc Finish"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle></svg></button>
                    <button class="btn-icon" onclick="setMaterial('black')" title="Black Oxide Finish"><svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="currentColor"></circle></svg></button>
                    <div style="width:1px; background:rgba(255,255,255,0.1); margin:0 4px;"></div>
                    <button class="btn-icon" onclick="setCamera('iso')" title="Reset View"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></button>
                </div>
            </section>
        </main>
    </div>

    <!-- LOGIC -->
    <script>
        // --- ICONS (SVG Strings) ---
        const ICONS = {
            chevron: '<svg class="tree-arrow icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>',
            folder: '<svg class="tree-icon icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>',
            file: '<svg class="tree-icon icon" viewBox="0 0 24 24" style="opacity:0.7"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>',
            cube: '<svg class="tree-icon icon" viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path></svg>'
        };

        let catalog = {};
        let scene, camera, renderer, currentMesh;
        let isDragging = false, prevMouse = {x:0, y:0};

        // --- INIT ---
        window.addEventListener('load', async () => {
            initThreeJS();
            try {
                const res = await fetch('catalog.json');
                if(!res.ok) throw new Error("Catalog fetch failed");
                catalog = await res.json();
                renderTree(catalog); // Initial Render
            } catch (err) {
                document.getElementById('catalog-tree').innerHTML = 
                    `<div class="state-msg" style="color:#ef4444"><p>Error loading catalog.json</p><small>${err.message}</small></div>`;
            }
        });

        // --- SEARCH ENGINE (DEEP FILTER) ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderTree(catalog, query);
        });

        function renderTree(data, query = "") {
            const container = document.getElementById('catalog-tree');
            container.innerHTML = "";
            
            for (const [catName, types] of Object.entries(data)) {
                const catNode = createCategoryNode(catName, types, query);
                if (catNode) container.appendChild(catNode);
            }
        }

        // 1. Create Category (Level 1)
        function createCategoryNode(name, types, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            for (const [typeName, content] of Object.entries(types)) {
                const typeNode = createTypeNode(typeName, content, query);
                if (typeNode) {
                    childrenFragment.appendChild(typeNode);
                    hasMatchingChild = true;
                }
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item expanded';

            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} ${ICONS.folder} <span class="tree-label">${name}</span>`;
            
            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-1';
            childrenContainer.appendChild(childrenFragment);

            if (!query) wrapper.classList.remove('expanded');
            else wrapper.classList.add('expanded');

            header.onclick = () => wrapper.classList.toggle('expanded');

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 2. Create Type (Level 2)
        function createTypeNode(name, content, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            if (content._default && content._default.files) {
                content._default.files.forEach(file => {
                    const fileNode = createFileNode(file, query);
                    if (fileNode) {
                        childrenFragment.appendChild(fileNode);
                        hasMatchingChild = true;
                    }
                });
            }

            for (const [key, val] of Object.entries(content)) {
                if (key === '_default' || key === '_root') continue;
                const stdNode = createStandardNode(key, val, query);
                if (stdNode) {
                    childrenFragment.appendChild(stdNode);
                    hasMatchingChild = true;
                }
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item';
            
            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} ${ICONS.cube} <span class="tree-label">${name}</span>`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-2';
            childrenContainer.appendChild(childrenFragment);

            if (query) wrapper.classList.add('expanded');

            header.onclick = (e) => {
                e.stopPropagation();
                wrapper.classList.toggle('expanded');
            };

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 3. Create Standard (Level 3)
        function createStandardNode(name, data, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            if (data.files) {
                data.files.forEach(file => {
                    const fileNode = createFileNode(file, query);
                    if (fileNode) {
                        childrenFragment.appendChild(fileNode);
                        hasMatchingChild = true;
                    }
                });
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item';

            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} <span class="tree-icon icon" style="color:var(--c-text-muted)">📐</span> <span class="tree-label">${name}</span>`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-2';
            childrenContainer.appendChild(childrenFragment);

            if (query) wrapper.classList.add('expanded');

            header.onclick = (e) => {
                e.stopPropagation();
                wrapper.classList.toggle('expanded');
            };

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 4. Create File (Leaf)
        function createFileNode(file, query) {
            if (query && !file.name.toLowerCase().includes(query)) return null;

            const div = document.createElement('div');
            div.className = 'file-item';
            const displayName = file.name.replace('.stl', '').replace('.STL', '');
            
            div.innerHTML = `${ICONS.file} <span>${displayName}</span>`;
            
            div.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                
                document.getElementById('model-title').innerText = displayName;
                const pathParts = file.path.split('/');
                const standard = pathParts.length > 2 ? pathParts[pathParts.length-2] : "Standard Component";
                document.getElementById('model-subtitle').innerText = standard;

                loadSTL(file.downloadUrl);
                
                if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
            };
            return div;
        }


        // --- THREE.JS VIEWER LOGIC ---
        function initThreeJS() {
            const container = document.getElementById('viewer-container');
            
            // Fix: Ensure container has explicit dimensions before init
            if (!container.clientWidth || !container.clientHeight) {
                setTimeout(initThreeJS, 100);
                return;
            }

            scene = new THREE.Scene();
            
            // Cinematic Lighting
            const ambient = new THREE.AmbientLight(0xffffff, 0.5);
            
            // Key Light
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(15, 20, 15);
            
            // Rim Light (Cyan)
            const rimLight = new THREE.DirectionalLight(0x06b6d4, 0.8);
            rimLight.position.set(-10, 5, -20);
            
            // Fill Light (Warm)
            const fillLight = new THREE.DirectionalLight(0xa5f3fc, 0.4);
            fillLight.position.set(-20, -10, 10);
            
            scene.add(ambient, dirLight, rimLight, fillLight);

            // Camera
            camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(30, 25, 30);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            // Tone mapping for realistic lighting
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            
            container.innerHTML = ''; // Clear previous if any
            container.appendChild(renderer.domElement);

            // Controls
            container.addEventListener('mousedown', e => { isDragging = true; prevMouse = {x:e.clientX, y:e.clientY}; });
            window.addEventListener('mouseup', () => isDragging = false);
            container.addEventListener('mousemove', e => {
                if(isDragging && currentMesh) {
                    const dx = e.clientX - prevMouse.x;
                    const dy = e.clientY - prevMouse.y;
                    currentMesh.rotation.y += dx * 0.005;
                    currentMesh.rotation.x += dy * 0.005;
                    prevMouse = {x:e.clientX, y:e.clientY};
                }
            });
            container.addEventListener('wheel', e => {
                e.preventDefault();
                camera.position.multiplyScalar(1 + e.deltaY * 0.001);
            });

            // Loop
            function animate() {
                requestAnimationFrame(animate);
                // Subtle auto-rotate
                if(currentMesh && !isDragging) currentMesh.rotation.y += 0.0015;
                renderer.render(scene, camera);
            }
            animate();
            
            // Responsive Resize
            window.addEventListener('resize', () => {
                if (!container) return;
                const width = container.clientWidth;
                const height = container.clientHeight;
                camera.aspect = width / height;
                camera.updateProjectionMatrix();
                renderer.setSize(width, height);
            });
        }

        function loadSTL(url) {
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('loading-state').classList.remove('hidden');
            
            if(currentMesh) {
                scene.remove(currentMesh);
                currentMesh.geometry.dispose();
                currentMesh.material.dispose();
            }

            fetch(url)
            .then(res => res.arrayBuffer())
            .then(buffer => {
                const geometry = parseSTL(buffer);
                geometry.center();
                
                // Fit to view
                geometry.computeBoundingBox();
                const size = geometry.boundingBox.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.y, size.z);
                const scale = 18 / maxDim; // Adjusted scale for better view
                
                const material = new THREE.MeshStandardMaterial({
                    color: 0xd4d4d8, 
                    metalness: 0.7, 
                    roughness: 0.2,
                    envMapIntensity: 1.0
                });
                
                currentMesh = new THREE.Mesh(geometry, material);
                currentMesh.scale.setScalar(scale);
                currentMesh.rotation.x = -Math.PI / 2;
                currentMesh.castShadow = true;
                currentMesh.receiveShadow = true;
                
                scene.add(currentMesh);
                
                // Reset Camera slightly
                camera.position.set(25, 20, 25);
                camera.lookAt(0,0,0);
                
                document.getElementById('loading-state').classList.add('hidden');
            })
            .catch(err => console.error(err));
        }

        // Robust STL Parser
        function parseSTL(buffer) {
            const view = new DataView(buffer);
            const isAscii = buffer.byteLength < 80 || new TextDecoder().decode(buffer.slice(0, 5)) === 'solid';
            const geom = new THREE.BufferGeometry();
            let vertices = [];

            if(isAscii) {
                const text = new TextDecoder().decode(buffer);
                const regex = /vertex\s+([\d-.]+)\s+([\d-.]+)\s+([\d-.]+)/g;
                let match;
                while((match = regex.exec(text)) !== null) {
                    vertices.push(parseFloat(match[1]), parseFloat(match[2]), parseFloat(match[3]));
                }
            } else {
                const count = view.getUint32(80, true);
                for(let i=0; i<count; i++) {
                    const offset = 84 + i*50;
                    for(let j=0; j<3; j++) {
                        const vOff = offset + 12 + j*12;
                        vertices.push(
                            view.getFloat32(vOff, true),
                            view.getFloat32(vOff+4, true),
                            view.getFloat32(vOff+8, true)
                        );
                    }
                }
            }
            geom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            geom.computeVertexNormals();
            return geom;
        }

        // --- VIEWER ACTIONS ---
        function setMaterial(type) {
            if(!currentMesh) return;
            if(type === 'zinc') {
                currentMesh.material.color.setHex(0xd4d4d8);
                currentMesh.material.metalness = 0.7;
                currentMesh.material.roughness = 0.2;
            } else if(type === 'black') {
                currentMesh.material.color.setHex(0x27272a);
                currentMesh.material.metalness = 0.3;
                currentMesh.material.roughness = 0.6;
            }
        }
        
        function setCamera(type) {
            camera.position.set(25, 20, 25);
            camera.lookAt(0,0,0);
        }
        
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        const style = document.createElement('style');
        style.innerHTML = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
        document.head.appendChild(style);

    </script>
</body>
