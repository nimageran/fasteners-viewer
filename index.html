<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fasteners 3D Library</title>
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>
    <style>
        /* --- FUTURISTIC THEME VARIABLES --- */
        :root {
            /* DEFAULT: Purple Neon (Futuristic Professional) */
            --c-bg: #0b1121; 
            --c-surface: #151e32;
            --c-surface-hover: #1e293b;
            --c-border: #2d3b55;
            --c-primary: #a855f7; /* Electric Purple */
            --c-primary-dim: rgba(168, 85, 247, 0.1);
            --c-primary-glow: rgba(168, 85, 247, 0.5);
            --c-text-main: #f1f5f9;
            --c-text-muted: #94a3b8;
            --c-text-dim: #64748b;
            
            --font-main: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: "Consolas", "Monaco", monospace;
            
            --radius: 6px; 
            --blur: 16px;
            
            /* Neon Effects */
            --shadow-glow: 0 0 15px var(--c-primary-dim), 0 0 2px var(--c-primary);
            --text-glow: 0 0 8px rgba(168, 85, 247, 0.4);
            --border-glow: 0 0 8px rgba(168, 85, 247, 0.3);
            --icon-glow: drop-shadow(0 0 5px rgba(168, 85, 247, 0.6));
            
            --bg-gradient: radial-gradient(circle at 15% 50%, rgba(168, 85, 247, 0.08), transparent 25%),
                           radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08), transparent 25%);
        }

        /* --- LIGHT THEME --- */
        [data-theme="light"] {
            --c-bg: #f8fafc;
            --c-surface: #ffffff;
            --c-surface-hover: #f1f5f9;
            --c-border: #e2e8f0;
            --c-primary: #2563eb; /* Professional Blue */
            --c-primary-dim: rgba(37, 99, 235, 0.1);
            --c-primary-glow: rgba(37, 99, 235, 0.2);
            --c-text-main: #0f172a;
            --c-text-muted: #475569;
            --c-text-dim: #94a3b8;
            --shadow-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --text-glow: none;
            --border-glow: none;
            --icon-glow: none;
            --bg-gradient: none;
        }

        /* --- DARK THEME (Standard) --- */
        [data-theme="dark"] {
            --c-bg: #0f172a;
            --c-surface: #1e293b;
            --c-surface-hover: #334155;
            --c-border: #334155;
            --c-primary: #38bdf8; /* Sky Blue */
            --c-primary-dim: rgba(56, 189, 248, 0.1);
            --c-primary-glow: rgba(56, 189, 248, 0.2);
            --c-text-main: #f8fafc;
            --c-text-muted: #cbd5e1;
            --c-text-dim: #64748b;
            --shadow-glow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --text-glow: none;
            --border-glow: none;
            --icon-glow: none;
            --bg-gradient: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--c-bg);
            background-image: var(--bg-gradient);
            color: var(--c-text-main);
            font-family: var(--font-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* --- ICONS --- */
        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: inline-block;
            vertical-align: middle;
            transition: all 0.3s ease;
        }
        .icon-lg { width: 20px; height: 20px; }

        /* --- LAYOUT --- */
        .app-layout {
            display: grid;
            grid-template-rows: 60px 1fr;
            height: 100%;
            width: 100%;
        }

        /* --- HEADER --- */
        .header {
            background: var(--c-surface); /* Fallback */
            background: color-mix(in srgb, var(--c-surface), transparent 15%);
            backdrop-filter: blur(var(--blur));
            border-bottom: 1px solid var(--c-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 50;
            box-shadow: 0 4px 30px rgba(0,0,0,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--c-primary);
            text-shadow: var(--text-glow);
        }
        
        .brand-logo-gfx {
            width: 32px;
            height: 32px;
            background: var(--c-primary-dim);
            border: 1px solid var(--c-primary);
            color: var(--c-primary);
            display: grid;
            place-items: center;
            border-radius: 4px;
            box-shadow: var(--shadow-glow);
        }
        
        .brand-logo-gfx svg {
            filter: var(--icon-glow);
        }

        .header-controls {
            display: flex;
            gap: 16px;
        }

        /* --- MAIN CONTAINER --- */
        .workspace {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: 100%;
            overflow: hidden;
            position: relative;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            background: color-mix(in srgb, var(--c-bg), transparent 10%);
            border-right: 1px solid var(--c-border);
            display: flex;
            flex-direction: column;
            backdrop-filter: blur(var(--blur));
            height: 100%;
            overflow: hidden;
        }

        .search-container {
            padding: 20px;
            border-bottom: 1px solid var(--c-border);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--c-primary);
            width: 14px;
            height: 14px;
            opacity: 0.8;
            filter: var(--icon-glow);
        }

        .search-input {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--c-border);
            color: var(--c-text-main);
            padding: 10px 12px 10px 36px;
            border-radius: var(--radius);
            font-size: 13px;
            font-family: var(--font-main);
            transition: all 0.2s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--c-primary);
            box-shadow: 0 0 0 1px var(--c-primary), inset 0 0 10px var(--c-primary-dim);
        }

        .catalog-tree {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        /* Tree Items */
        .tree-item {
            display: block;
            cursor: pointer;
            margin-bottom: 4px;
            user-select: none;
        }

        .tree-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius);
            color: var(--c-text-muted);
            font-size: 13px;
            transition: 0.2s;
            border: 1px solid transparent;
        }

        .tree-header:hover {
            background: var(--c-surface-hover);
            color: var(--c-text-main);
            border-color: var(--c-primary-dim);
            box-shadow: 0 0 10px var(--c-primary-dim);
        }
        
        .tree-header:hover .tree-icon {
            filter: var(--icon-glow);
            color: var(--c-primary);
        }
        
        /* Hierarchy indentation */
        .indent-1 { padding-left: 16px; border-left: 1px solid var(--c-border); margin-left: 10px; }
        .indent-2 { padding-left: 16px; border-left: 1px solid var(--c-border); margin-left: 10px; }

        .tree-arrow {
            margin-right: 10px;
            transition: transform 0.2s;
            color: var(--c-text-dim);
            width: 12px;
            height: 12px;
            opacity: 0.7;
        }
        
        .tree-icon {
            margin-right: 10px;
            color: var(--c-text-muted);
            transition: 0.2s;
        }

        .tree-label {
            flex: 1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
            letter-spacing: 0.02em;
        }
        
        .expanded > .tree-header .tree-arrow {
            transform: rotate(90deg);
            color: var(--c-primary);
            filter: drop-shadow(0 0 3px var(--c-primary));
        }
        
        .expanded > .tree-header {
            color: var(--c-text-main);
            background: var(--c-primary-dim);
            border-color: var(--c-primary-dim);
        }

        .expanded > .tree-header .tree-icon {
            color: var(--c-primary);
            filter: var(--icon-glow);
        }

        .tree-children {
            display: none;
        }
        
        .expanded > .tree-children {
            display: block;
            animation: slideDown 0.2s ease-out;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* File Item */
        .file-item {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--c-text-muted);
            cursor: pointer;
            border-radius: var(--radius);
            transition: all 0.2s;
            margin-bottom: 2px;
            border: 1px solid transparent;
        }

        .file-item:hover {
            color: var(--c-text-main);
            background: var(--c-surface-hover);
            border-color: var(--c-border);
        }
        
        .file-item:hover .icon {
            color: var(--c-primary);
            filter: var(--icon-glow);
        }

        .file-item.active {
            color: var(--c-text-main);
            font-weight: 600;
            background: linear-gradient(90deg, var(--c-primary-dim), transparent);
            border: 1px solid var(--c-primary-glow);
            box-shadow: inset 2px 0 0 var(--c-primary), 0 0 15px var(--c-primary-dim);
        }
        
        .file-item.active .icon {
            color: var(--c-primary);
            filter: var(--icon-glow);
        }

        /* --- VIEWER --- */
        .viewer-area {
            position: relative;
            background: var(--c-bg);
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        #viewer-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: block;
            outline: none;
        }

        .viewer-overlay {
            position: absolute;
            top: 24px;
            left: 24px;
            pointer-events: none;
            z-index: 10;
        }

        .model-title {
            font-size: 28px;
            font-weight: 200;
            color: var(--c-text-main);
            text-shadow: var(--text-glow);
            margin-bottom: 6px;
            letter-spacing: -0.02em;
        }

        .model-subtitle {
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--c-primary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            background: var(--c-surface);
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid var(--c-primary-dim);
            display: inline-block;
            backdrop-filter: blur(4px);
            box-shadow: var(--shadow-glow);
        }

        .viewer-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            background: color-mix(in srgb, var(--c-surface), transparent 15%);
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid var(--c-border);
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            z-index: 10;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid transparent;
            color: var(--c-text-muted);
            width: 42px;
            height: 42px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-icon:hover {
            background: var(--c-primary-dim);
            color: var(--c-text-main);
            border-color: var(--c-border);
            box-shadow: var(--shadow-glow);
        }
        
        .btn-icon:hover svg {
            filter: var(--icon-glow);
        }

        .btn-icon.active {
            color: var(--c-primary);
            background: var(--c-primary-dim);
        }

        .control-divider {
            width: 1px;
            align-self: stretch;
            background: var(--c-border);
        }

        /* Material Buttons */
        .material-group {
            display: flex;
            gap: 12px;
            padding-right: 12px;
            margin-right: 12px;
            border-right: 1px solid var(--c-border);
        }

        .mat-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            position: relative;
            transition: transform 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        
        .mat-btn:hover {
            transform: scale(1.15);
            border-color: var(--c-primary);
        }
        
        .mat-btn.active {
            border-color: var(--c-primary);
            box-shadow: 0 0 12px var(--c-primary-dim), 0 0 4px var(--c-primary);
        }

        /* Tooltip for materials */
        .mat-btn:hover::after {
            content: attr(data-title);
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--c-surface);
            color: var(--c-text-main);
            padding: 4px 8px;
            font-size: 10px;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid var(--c-border);
            pointer-events: none;
        }

        /* --- LOADING & EMPTY STATES --- */
        .state-msg {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--c-text-dim);
            pointer-events: none;
            z-index: 5;
        }

        .state-msg svg {
            width: 56px;
            height: 56px;
            margin-bottom: 20px;
            opacity: 0.4;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        
        .state-msg.error { color: #ef4444; pointer-events: auto; text-align: center; padding: 0 24px; }
        .state-msg.error small { color: var(--c-text-muted); margin-top: 6px; max-width: 420px; word-break: break-word; }
        .btn-text {
            margin-top: 16px;
            background: var(--c-surface);
            color: var(--c-text-main);
            border: 1px solid var(--c-border);
            border-radius: var(--radius);
            padding: 8px 16px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-text:hover { border-color: var(--c-primary); color: var(--c-primary); }

        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* --- SPEC CARD --- */
        .spec-card {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 270px;
            z-index: 10;
            background: color-mix(in srgb, var(--c-surface), transparent 10%);
            border: 1px solid var(--c-border);
            border-radius: 10px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            font-size: 12px;
        }

        .spec-card summary {
            list-style: none;
            cursor: pointer;
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--c-text-muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .spec-card summary::-webkit-details-marker { display: none; }
        .spec-card summary::after { content: "\25BE"; transition: transform 0.2s; }
        .spec-card:not([open]) summary::after { transform: rotate(-90deg); }

        .spec-list {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 8px 12px;
            padding: 0 16px 12px;
            border-top: 1px solid var(--c-border);
            padding-top: 12px;
        }
        .spec-list dt { color: var(--c-text-dim); white-space: nowrap; }
        .spec-list dd { color: var(--c-text-main); font-family: var(--font-mono); text-align: right; word-break: break-word; }
        .spec-list dd.highlight { color: var(--c-primary); font-weight: 600; }

        .spec-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 0 16px 16px;
            padding: 9px 12px;
            border-radius: var(--radius);
            border: 1px solid var(--c-primary);
            color: var(--c-primary);
            background: var(--c-primary-dim);
            text-decoration: none;
            font-weight: 600;
        }
        .spec-download:hover { background: var(--c-primary); color: var(--c-surface); }

        .hidden { display: none !important; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--c-text-dim); }

        /* Responsive */
        @media (max-width: 768px) {
            .workspace { grid-template-columns: 1fr; }
            .sidebar { position: absolute; inset: 0; z-index: 100; transform: translateX(-100%); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
            .sidebar.open { transform: translateX(0); }
            .mobile-toggle { display: block; }
            .viewer-overlay { top: 16px; left: 16px; right: 16px; }
            .model-title { font-size: 20px; }
            .spec-card { top: auto; bottom: 96px; left: 16px; right: 16px; width: auto; }
            .viewer-controls { bottom: 16px; gap: 6px; padding: 8px 10px; max-width: calc(100% - 32px); }
            .material-group { gap: 8px; padding-right: 8px; margin-right: 0; }
            .btn-icon { width: 36px; height: 36px; }
        }
        @media (min-width: 769px) {
            .mobile-toggle { display: none; }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- HEADER -->
        <header class="header">
            <div class="brand">
                <div class="brand-logo-gfx">
                    <!-- Database Icon -->
                    <svg class="icon" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>
                </div>
                <span>Fasteners<span style="color:var(--c-text-muted); font-weight:400; font-size: 0.9em;">DB</span></span>
            </div>
            
            <div class="header-controls">
                <!-- THEME TOGGLE -->
                <button class="btn-icon" id="theme-btn" title="Switch Theme">
                    <svg class="icon-lg" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
                
                <button class="btn-icon mobile-toggle" id="sidebar-btn" title="Catalog">
                    <svg class="icon-lg" viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                </button>
                <a href="https://github.com/nimageran/fasteners-viewer" target="_blank" class="btn-icon" title="View on GitHub">
                    <svg class="icon-lg" viewBox="0 0 24 24"><path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path></svg>
                </a>
            </div>
        </header>

        <!-- MAIN WORKSPACE -->
        <main class="workspace">
            
            <!-- SIDEBAR -->
            <aside class="sidebar" id="sidebar">
                <div class="search-container">
                    <div class="search-box">
                        <!-- Search Icon -->
                        <svg viewBox="0 0 24 24" class="icon"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                        <input type="text" id="search-input" class="search-input" placeholder="Search components...">
                    </div>
                </div>
                <div id="catalog-tree" class="catalog-tree">
                    <!-- Tree content injected by JS -->
                    <div class="state-msg" style="position:static; padding:20px;">
                        <svg class="icon icon-lg spin" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>
                        <span style="font-size:12px; margin-top:10px;">Initializing Database...</span>
                    </div>
                </div>
            </aside>

            <!-- VIEWER AREA -->
            <section class="viewer-area">
                <div class="viewer-overlay">
                    <h1 id="model-title" class="model-title">Welcome</h1>
                    <div id="model-subtitle" class="model-subtitle">Select a component</div>
                </div>

                <!-- 3D Canvas Container -->
                <div id="viewer-container"></div>

                <div class="state-msg" id="empty-state">
                    <svg viewBox="0 0 24 24" class="icon"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="7.5 4.21 12 6.81 16.5 4.21"></polyline><polyline points="7.5 19.79 7.5 14.6 3 12"></polyline><polyline points="21 12 16.5 14.6 16.5 19.79"></polyline><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
                    <p>Select a file from the catalog</p>
                </div>

                <div class="state-msg hidden" id="loading-state">
                    <svg class="icon icon-lg spin" viewBox="0 0 24 24"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"></path></svg>
                    <p>Loading Geometry...</p>
                </div>

                <div class="state-msg error hidden" id="error-state">
                    <p>Could not load this model</p>
                    <small id="error-detail"></small>
                    <button class="btn-text" id="retry-btn" type="button">Try again</button>
                </div>

                <!-- Spec Card -->
                <details class="spec-card hidden" id="spec-card" open>
                    <summary>Specifications</summary>
                    <dl class="spec-list" id="spec-list"></dl>
                    <a class="spec-download" id="spec-download" href="#" download>
                        <svg class="icon" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                        Download STL
                    </a>
                </details>

                <!-- Floating Controls -->
                <div class="viewer-controls">
                    <!-- MATERIALS -->
                    <div class="material-group">
                        <div class="mat-btn active" data-mat="stainless" data-title="Stainless Steel" style="background:linear-gradient(135deg, #e2e8f0, #94a3b8);"></div>
                        <div class="mat-btn" data-mat="steel" data-title="Carbon Steel" style="background:linear-gradient(135deg, #525252, #262626);"></div>
                        <div class="mat-btn" data-mat="brass" data-title="Brass" style="background:linear-gradient(135deg, #facc15, #854d0e);"></div>
                        <div class="mat-btn" data-mat="black" data-title="Black Oxide" style="background:linear-gradient(135deg, #171717, #000000);"></div>
                    </div>
                    
                    <button class="btn-icon" id="reset-view-btn" title="Reset View"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg></button>
                    <button class="btn-icon active" id="rotate-btn" title="Auto-rotate (on)"><svg class="icon" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"></path><polyline points="21 3 21 9 15 9"></polyline></svg></button>
                    <button class="btn-icon active" id="grid-btn" title="Millimetre grid (on)"><svg class="icon" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="1"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="3" y1="15" x2="21" y2="15"></line><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg></button>
                </div>
            </section>
        </main>
    </div>

    <!-- LOGIC -->
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { STLLoader } from 'three/addons/loaders/STLLoader.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

        // --- ICONS (SVG Strings) ---
        const ICONS = {
            chevron: '<svg class="tree-arrow icon" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>',
            folder: '<svg class="tree-icon icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>',
            file: '<svg class="tree-icon icon" viewBox="0 0 24 24" style="opacity:0.7"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path><polyline points="13 2 13 9 20 9"></polyline></svg>',
            category: '<svg class="tree-icon icon" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>'
        };

        let catalog = {};
        let scene, camera, renderer, controls, modelGroup, currentMesh;
        let keyLight, ground, grid;
        let activeFile = null;
        let loadAbort = null;
        let autoRotateEnabled = true;  // user preference (toolbar toggle)
        let autoRotateTimeout = null;  // resumes spinning after the user lets go
        let gridEnabled = true;

        // Material Definitions
        const materials = {
            stainless: { color: 0xd4d4d8, metalness: 1.0, roughness: 0.25 },
            steel: { color: 0x6b6b6b, metalness: 0.9, roughness: 0.5 },
            brass: { color: 0xe0b44a, metalness: 1.0, roughness: 0.3 },
            black: { color: 0x1f1f1f, metalness: 0.6, roughness: 0.6 },
        };
        let activeMaterial = 'stainless';

        // Natural sort that understands decimals: DowelPin_1x3 < DowelPin_1.5x4 < DowelPin_2x6, M4 < M10
        function naturalCompare(a, b) {
            const re = /(\d+(?:\.\d+)?)/;
            const pa = a.toLowerCase().split(re), pb = b.toLowerCase().split(re);
            for (let i = 0; i < Math.min(pa.length, pb.length); i++) {
                if (pa[i] === pb[i]) continue;
                // split() with a capture group puts the numbers at odd indexes
                if (i % 2 === 1) return parseFloat(pa[i]) - parseFloat(pb[i]);
                return pa[i] < pb[i] ? -1 : 1;
            }
            return pa.length - pb.length;
        }

        // --- INIT ---
        initThreeJS();
        bindUI();
        loadCatalog();

        async function loadCatalog() {
            try {
                const res = await fetch('catalog.json');
                if(!res.ok) throw new Error("Catalog fetch failed");
                catalog = await res.json();
                sortCatalogFiles(catalog);
                renderTree(catalog);
            } catch (err) {
                document.getElementById('catalog-tree').innerHTML =
                    `<div class="state-msg" style="color:#ef4444"><p>Error loading catalog.json</p><small>${err.message}</small></div>`;
            }
        }

        function sortCatalogFiles(node) {
            if (!node || typeof node !== 'object') return;
            if (Array.isArray(node.files)) node.files.sort((a, b) => naturalCompare(a.name, b.name));
            for (const [key, val] of Object.entries(node)) {
                if (key !== 'files') sortCatalogFiles(val);
            }
        }

        // --- SEARCH ENGINE ---
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            renderTree(catalog, query);
        });

        function renderTree(data, query = "") {
            const container = document.getElementById('catalog-tree');
            container.innerHTML = "";
            for (const [catName, types] of Object.entries(data)) {
                const catNode = createCategoryNode(catName, types, query);
                if (catNode) container.appendChild(catNode);
            }
        }

        // 1. Create Category (Level 1)
        function createCategoryNode(name, types, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            for (const [typeName, content] of Object.entries(types)) {
                const typeNode = createTypeNode(typeName, content, query);
                if (typeNode) {
                    childrenFragment.appendChild(typeNode);
                    hasMatchingChild = true;
                }
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item expanded';

            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} ${ICONS.folder} <span class="tree-label">${name}</span>`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-1';
            childrenContainer.appendChild(childrenFragment);

            if (!query) wrapper.classList.remove('expanded');
            else wrapper.classList.add('expanded');

            header.onclick = () => wrapper.classList.toggle('expanded');

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 2. Create Type (Level 2)
        function createTypeNode(name, content, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            if (content._default && content._default.files) {
                content._default.files.forEach(file => {
                    const fileNode = createFileNode(file, query);
                    if (fileNode) {
                        childrenFragment.appendChild(fileNode);
                        hasMatchingChild = true;
                    }
                });
            }

            for (const [key, val] of Object.entries(content)) {
                if (key === '_default' || key === '_root') continue;
                const stdNode = createStandardNode(key, val, query);
                if (stdNode) {
                    childrenFragment.appendChild(stdNode);
                    hasMatchingChild = true;
                }
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item';

            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} ${ICONS.folder} <span class="tree-label">${name}</span>`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-2';
            childrenContainer.appendChild(childrenFragment);

            if (query) wrapper.classList.add('expanded');

            header.onclick = (e) => {
                e.stopPropagation();
                wrapper.classList.toggle('expanded');
            };

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 3. Create Standard (Level 3)
        function createStandardNode(name, data, query) {
            const childrenFragment = document.createDocumentFragment();
            let hasMatchingChild = false;

            if (data.files) {
                data.files.forEach(file => {
                    const fileNode = createFileNode(file, query);
                    if (fileNode) {
                        childrenFragment.appendChild(fileNode);
                        hasMatchingChild = true;
                    }
                });
            }

            const nameMatch = name.toLowerCase().includes(query);
            if (query && !nameMatch && !hasMatchingChild) return null;

            const wrapper = document.createElement('div');
            wrapper.className = 'tree-item';

            const header = document.createElement('div');
            header.className = 'tree-header';
            header.innerHTML = `${ICONS.chevron} <span class="tree-icon icon" style="color:var(--c-text-muted)">📐</span> <span class="tree-label">${name}</span>`;

            const childrenContainer = document.createElement('div');
            childrenContainer.className = 'tree-children indent-2';
            childrenContainer.appendChild(childrenFragment);

            if (query) wrapper.classList.add('expanded');

            header.onclick = (e) => {
                e.stopPropagation();
                wrapper.classList.toggle('expanded');
            };

            wrapper.appendChild(header);
            wrapper.appendChild(childrenContainer);
            return wrapper;
        }

        // 4. Create File (Leaf)
        function createFileNode(file, query) {
            if (query && !file.name.toLowerCase().includes(query)) return null;

            const div = document.createElement('div');
            div.className = 'file-item';
            if (activeFile && activeFile.path === file.path) div.classList.add('active');
            const displayName = file.name.replace(/\.stl$/i, '');

            div.innerHTML = `${ICONS.file} <span>${displayName}</span>`;

            div.onclick = (e) => {
                e.stopPropagation();
                document.querySelectorAll('.file-item').forEach(el => el.classList.remove('active'));
                div.classList.add('active');
                selectFile(file);
                if(window.innerWidth < 768) document.getElementById('sidebar').classList.remove('open');
            };
            return div;
        }

        // --- FILE NAME → SPECS ---
        // Names follow Type_Size_Standard, e.g. ButtonHead_M10x16_ISO7380-1,
        // HexNut_M8_DIN934, DowelPin_6x30_ISO8734, EClip_10-14mm_DIN6799
        function parseFastenerName(fileName) {
            const parts = fileName.replace(/\.stl$/i, '').split('_');
            const info = { type: null, standard: null, rows: [] };

            info.type = parts[0].replace(/([a-z])([A-Z])/g, '$1 $2');
            const last = parts[parts.length - 1];
            if (parts.length > 1 && /^(ISO|DIN|GOST|ANSI|ASME|EN|JIS)/i.test(last)) {
                info.standard = last.replace(/^([A-Za-z]+)(\d)/, (m, a, b) => `${a.toUpperCase()} ${b}`);
            }

            const size = parts.length > 2 ? parts[1] : (info.standard ? null : parts[1]);
            if (!size) return info;
            const isRing = /ring|clip/i.test(parts[0]);
            let m;
            if ((m = size.match(/^M(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i))) {
                info.rows.push(['Thread', `M${m[1]}`], ['Length', `${m[2]} mm`]);
            } else if ((m = size.match(/^M(\d+(?:\.\d+)?)$/i))) {
                info.rows.push(['Thread', `M${m[1]}`]);
            } else if ((m = size.match(/^(\d+(?:\.\d+)?)x(\d+(?:\.\d+)?)$/i))) {
                info.rows.push(['Diameter', `Ø${m[1]} mm`], ['Length', `${m[2]} mm`]);
            } else if ((m = size.match(/^(\d+(?:\.\d+)?)-(\d+(?:\.\d+)?)mm$/i))) {
                info.rows.push(['Shaft Ø', `${m[1]}–${m[2]} mm`]);
            } else if ((m = size.match(/^(\d+(?:\.\d+)?)mm$/i))) {
                const label = !isRing ? 'Nominal Ø' : (/internal/i.test(parts[0]) ? 'Bore Ø' : 'Shaft Ø');
                info.rows.push([label, `${m[1]} mm`]);
            } else {
                info.rows.push(['Size', size]);
            }
            return info;
        }

        // Prefer the copy served next to this page (GitHub Pages), fall back to raw.githubusercontent
        function fileUrls(file) {
            const local = file.path.split('/').map(encodeURIComponent).join('/');
            return file.downloadUrl ? [local, file.downloadUrl] : [local];
        }

        function selectFile(file) {
            activeFile = file;
            const info = parseFastenerName(file.name);
            const category = file.path.split('/')[0];

            document.getElementById('model-title').innerText = file.name.replace(/\.stl$/i, '');
            document.getElementById('model-subtitle').innerText =
                [info.standard, info.type].filter(Boolean).join(' · ') || category;

            loadSTL(file);
        }

        function formatMM(v) {
            return (Math.round(v * 10) / 10).toString();
        }

        function formatBytes(bytes) {
            if (bytes < 1024) return `${bytes} B`;
            if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(0)} KB`;
            return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
        }

        function renderSpecs(file, size, triangles, bytes, gridStep) {
            const info = parseFastenerName(file.name);
            const rows = [];
            if (info.type) rows.push(['Type', info.type]);
            if (info.standard) rows.push(['Standard', info.standard]);
            rows.push(...info.rows);
            rows.push(['Envelope', `${formatMM(size.x)} × ${formatMM(size.y)} × ${formatMM(size.z)} mm`, true]);
            rows.push(['Grid cell', `${gridStep} mm`]);
            rows.push(['Triangles', triangles.toLocaleString()]);
            rows.push(['File size', formatBytes(bytes)]);

            const list = document.getElementById('spec-list');
            list.innerHTML = '';
            for (const [label, value, highlight] of rows) {
                const dt = document.createElement('dt');
                dt.textContent = label;
                const dd = document.createElement('dd');
                dd.textContent = value;
                if (highlight) dd.className = 'highlight';
                list.append(dt, dd);
            }

            const link = document.getElementById('spec-download');
            link.href = fileUrls(file)[0];
            link.setAttribute('download', file.name);
            document.getElementById('spec-card').classList.remove('hidden');
        }

        // --- THREE.JS VIEWER LOGIC ---
        function initThreeJS() {
            const container = document.getElementById('viewer-container');

            scene = new THREE.Scene();
            modelGroup = new THREE.Group();
            scene.add(modelGroup);

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.innerHTML = '';
            container.appendChild(renderer.domElement);

            // Studio lighting: a soft room environment for the metal to reflect, plus one key light for shadows
            const pmrem = new THREE.PMREMGenerator(renderer);
            scene.environment = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;
            pmrem.dispose();

            keyLight = new THREE.DirectionalLight(0xffffff, 1.6);
            keyLight.castShadow = true;
            keyLight.shadow.mapSize.set(2048, 2048);
            keyLight.shadow.bias = -0.0005;
            keyLight.shadow.normalBias = 0.02;
            scene.add(keyLight, keyLight.target);

            // Ground: invisible except for the contact shadow
            ground = new THREE.Mesh(
                new THREE.PlaneGeometry(1, 1),
                new THREE.ShadowMaterial({ opacity: 0.18 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            ground.visible = false;
            scene.add(ground);

            // Camera
            camera = new THREE.PerspectiveCamera(40, 1, 0.1, 1000);
            camera.position.set(30, 25, 30);

            // Orbit controls: mouse + touch rotate, right-drag / two-finger pan, wheel / pinch zoom
            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.08;
            controls.autoRotateSpeed = 1.5;
            controls.autoRotate = false;

            // Pause the spin only while the user is actually handling the model
            controls.addEventListener('start', () => {
                controls.autoRotate = false;
                clearTimeout(autoRotateTimeout);
            });
            controls.addEventListener('end', scheduleAutoRotate);

            // Size the canvas to its container (handles window resize and sidebar changes)
            const resize = () => {
                const w = container.clientWidth, h = container.clientHeight;
                if (!w || !h) return;
                camera.aspect = w / h;
                camera.updateProjectionMatrix();
                renderer.setSize(w, h, false);
                renderer.domElement.style.width = '100%';
                renderer.domElement.style.height = '100%';
            };
            new ResizeObserver(resize).observe(container);
            resize();

            renderer.setAnimationLoop(() => {
                controls.update();
                renderer.render(scene, camera);
            });
        }

        function scheduleAutoRotate() {
            clearTimeout(autoRotateTimeout);
            if (!autoRotateEnabled || !currentMesh) return;
            autoRotateTimeout = setTimeout(() => { controls.autoRotate = true; }, 2500);
        }

        function disposeCurrentModel() {
            if (!currentMesh) return;
            modelGroup.remove(currentMesh);
            currentMesh.geometry.dispose();
            currentMesh.material.dispose();
            currentMesh = null;
        }

        async function fetchFirst(urls, signal) {
            let lastErr;
            for (const url of urls) {
                try {
                    const res = await fetch(url, { signal });
                    if (!res.ok) throw new Error(`HTTP ${res.status} for ${decodeURIComponent(url)}`);
                    return await res.arrayBuffer();
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                    lastErr = err;
                }
            }
            throw lastErr;
        }

        function showState(id) {
            for (const s of ['empty-state', 'loading-state', 'error-state']) {
                document.getElementById(s).classList.toggle('hidden', s !== id);
            }
        }

        async function loadSTL(file) {
            if (loadAbort) loadAbort.abort();
            const abort = loadAbort = new AbortController();

            showState('loading-state');
            disposeCurrentModel();
            if (grid) grid.visible = false;
            ground.visible = false;
            document.getElementById('spec-card').classList.add('hidden');

            let buffer, geometry;
            try {
                buffer = await fetchFirst(fileUrls(file), abort.signal);
                geometry = new STLLoader().parse(buffer);
                if (!geometry.attributes.position || geometry.attributes.position.count === 0) {
                    throw new Error('The STL file contains no triangles');
                }
            } catch (err) {
                if (err.name === 'AbortError' || abort !== loadAbort) return;
                console.error(err);
                document.getElementById('error-detail').textContent = err.message;
                showState('error-state');
                return;
            }
            if (abort !== loadAbort) { geometry.dispose(); return; }

            // Real size in the file's own units (mm), before any re-orientation
            geometry.computeBoundingBox();
            const size = geometry.boundingBox.getSize(new THREE.Vector3());
            const triangles = geometry.attributes.position.count / 3;

            // Smooth round surfaces but keep hex flats, thread flanks and chamfers crisp
            geometry.deleteAttribute('normal');
            const shaded = toCreasedNormals(geometry, THREE.MathUtils.degToRad(20));
            geometry.dispose();

            // Z-up CAD export → Y-up scene, sitting on the ground at the origin
            shaded.rotateX(-Math.PI / 2);
            shaded.computeBoundingBox();
            const box = shaded.boundingBox;
            const center = box.getCenter(new THREE.Vector3());
            shaded.translate(-center.x, -box.min.y, -center.z);
            shaded.computeBoundingBox();
            shaded.computeBoundingSphere();

            const matProps = materials[activeMaterial];
            const material = new THREE.MeshStandardMaterial({
                color: matProps.color,
                metalness: matProps.metalness,
                roughness: matProps.roughness,
            });

            currentMesh = new THREE.Mesh(shaded, material);
            currentMesh.castShadow = true;
            currentMesh.receiveShadow = true;
            modelGroup.add(currentMesh);

            const gridStep = updateStage(shaded);
            setCamera('iso');
            controls.autoRotate = autoRotateEnabled;

            renderSpecs(file, size, triangles, buffer.byteLength, gridStep);
            showState(null);
        }

        // Pick a round grid cell (1, 2, 5, 10 … mm) so roughly 5 cells span the part
        function niceStep(x) {
            const pow = Math.pow(10, Math.floor(Math.log10(x)));
            const n = x / pow;
            return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * pow;
        }

        function updateStage(geometry) {
            const box = geometry.boundingBox;
            const sizeVec = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
            const radius = geometry.boundingSphere.radius;

            // Millimetre grid under the part
            const step = niceStep(maxDim / 5);
            const cells = Math.max(10, Math.ceil((maxDim * 3) / step / 2) * 2);
            if (grid) {
                scene.remove(grid);
                grid.geometry.dispose();
                grid.material.dispose();
            }
            grid = new THREE.GridHelper(cells * step, cells);
            grid.material.transparent = true;
            grid.material.depthWrite = false;
            grid.position.y = maxDim * 0.0005;
            grid.visible = gridEnabled;
            scene.add(grid);
            applyThemeToScene();

            ground.scale.setScalar(maxDim * 20);
            ground.visible = true;

            // Key light follows the model's scale so the shadow stays sharp
            const target = geometry.boundingSphere.center;
            keyLight.target.position.copy(target);
            keyLight.position.copy(target).add(new THREE.Vector3(0.6, 1.2, 0.8).multiplyScalar(radius * 3));
            const cam = keyLight.shadow.camera;
            cam.left = cam.bottom = -radius * 1.5;
            cam.right = cam.top = radius * 1.5;
            cam.near = radius * 0.1;
            cam.far = radius * 8;
            cam.updateProjectionMatrix();

            return Number(step.toPrecision(3));
        }

        function applyThemeToScene() {
            if (!grid) return;
            const css = getComputedStyle(document.documentElement);
            grid.material.color.set(css.getPropertyValue('--c-text-dim').trim() || '#64748b');
            grid.material.opacity = document.documentElement.dataset.theme === 'light' ? 0.35 : 0.25;
            ground.material.opacity = document.documentElement.dataset.theme === 'light' ? 0.18 : 0.35;
        }

        // --- UI ACTIONS ---
        function setMaterial(type) {
            activeMaterial = type;
            document.querySelectorAll('.mat-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mat === type));

            if(!currentMesh) return;
            const props = materials[type];
            currentMesh.material.color.setHex(props.color);
            currentMesh.material.metalness = props.metalness;
            currentMesh.material.roughness = props.roughness;
        }

        function setCamera(type) {
            if(!camera) return;
            const sphere = currentMesh ? currentMesh.geometry.boundingSphere : new THREE.Sphere(new THREE.Vector3(), 10);
            const fov = THREE.MathUtils.degToRad(camera.fov);
            const fitFov = camera.aspect < 1 ? 2 * Math.atan(Math.tan(fov / 2) * camera.aspect) : fov;
            const dist = (sphere.radius / Math.sin(fitFov / 2)) * 1.6;

            const dirs = {
                front: [0, 0, 1], back: [0, 0, -1], top: [0, 1, 0.0001], bottom: [0, -1, 0.0001],
                left: [-1, 0, 0], right: [1, 0, 0], iso: [1, 0.8, 1],
            };
            const dir = new THREE.Vector3(...(dirs[type] || dirs.iso)).normalize();

            controls.target.copy(sphere.center);
            camera.position.copy(sphere.center).addScaledVector(dir, dist);
            camera.near = dist / 100;
            camera.far = dist * 100;
            camera.updateProjectionMatrix();
            controls.minDistance = sphere.radius * 0.6;
            controls.maxDistance = dist * 6;
            controls.update();
        }

        function toggleAutoRotate() {
            autoRotateEnabled = !autoRotateEnabled;
            controls.autoRotate = autoRotateEnabled && !!currentMesh;
            clearTimeout(autoRotateTimeout);
            const btn = document.getElementById('rotate-btn');
            btn.classList.toggle('active', autoRotateEnabled);
            btn.title = `Auto-rotate (${autoRotateEnabled ? 'on' : 'off'})`;
        }

        function toggleGrid() {
            gridEnabled = !gridEnabled;
            if (grid && currentMesh) grid.visible = gridEnabled;
            const btn = document.getElementById('grid-btn');
            btn.classList.toggle('active', gridEnabled);
            btn.title = `Millimetre grid (${gridEnabled ? 'on' : 'off'})`;
        }

        const themes = ['light', 'neon', 'dark'];
        let themeIdx = 0;

        function cycleTheme() {
            themeIdx = (themeIdx + 1) % themes.length;
            document.documentElement.setAttribute('data-theme', themes[themeIdx]);
            applyThemeToScene();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        function bindUI() {
            document.querySelectorAll('.mat-btn').forEach(btn => btn.addEventListener('click', () => setMaterial(btn.dataset.mat)));
            document.getElementById('reset-view-btn').addEventListener('click', () => setCamera('iso'));
            document.getElementById('rotate-btn').addEventListener('click', toggleAutoRotate);
            document.getElementById('grid-btn').addEventListener('click', toggleGrid);
            document.getElementById('theme-btn').addEventListener('click', cycleTheme);
            document.getElementById('sidebar-btn').addEventListener('click', toggleSidebar);
            document.getElementById('retry-btn').addEventListener('click', () => activeFile && loadSTL(activeFile));
            if (window.innerWidth < 768) document.getElementById('spec-card').removeAttribute('open');
        }
    </script>
</body>
</html>
